<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>お問い合わせ | 投球力ラボ</title>

    <meta
        name="description"
        content="投球力ラボへのお問い合わせページです。記事に関するご質問、ご意見、ご要望はこちらからお送りください。"
    >

    <link rel="stylesheet" href="style.css">

    <style>
        .contact-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .contact-description {
            line-height: 1.9;
            margin-bottom: 24px;
        }

        .contact-form-embed {
            width: 100%;
            overflow: hidden;
            border-radius: 8px;
            background-color: #ffffff;
        }

        .contact-form-embed iframe {
            display: block;
            width: 100%;
            height: 1000px;
            border: none;
        }

        @media (max-width: 600px) {
            .contact-container {
                padding: 12px;
            }

            .contact-form-embed iframe {
                height: 1100px;
            }
        }
    </style>
</head>

<body>

    <!-- ヘッダー -->
    <header class="site-header">

        <div class="header-inner">

            <a href="index.html" class="site-logo">
                投球力ラボ
            </a>

            <nav class="site-nav">
                <a href="index.html">ホーム</a>
                <a href="articles/articles.html">記事一覧</a>
            </nav>

        </div>

    </header>


    <!-- メインコンテンツ -->
    <main class="article-page">

        <div class="contact-container">

            <div class="article-header">

                <span class="category">
                    サイト情報
                </span>

                <h1>
                    お問い合わせ
                </h1>

            </div>

            <div class="article-body">

                <p class="contact-description">
                    投球力ラボをご覧いただきありがとうございます。<br>
                    記事に関するご質問、ご意見、ご要望などがございましたら、
                    以下のフォームからお問い合わせください。
                </p>

                <div class="contact-form-embed">

                    <iframe
                        src="https://docs.google.com/forms/d/e/1FAIpQLSd8DFnw1G5UPw4ffTi2RVdR3oNh83QRt4_6lFnQg1U_K4sc_w/viewform?embedded=true"
                        title="投球力ラボ お問い合わせフォーム"
                        loading="lazy"
                    >
                        読み込んでいます…
                    </iframe>

                </div>

            </div>

        </div>

    </main>


    <!-- フッター -->
    <footer class="footer">

        <p>
            © 2026 投球力ラボ
        </p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
